[project]
name = "ragqa"
version = "0.1.0"
description = "Retrieval-augmented question answering with pluggable stores, two orchestration pipelines, and an offline evaluation suite."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arpan Bom", email = "applycoding@gmail.com" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "langchain-core>=0.3",
  "llama-index-core>=0.12",
  "httpx>=0.27",
  "openai>=1.40",
  "anthropic>=0.39",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
hosted = ["pinecone>=5", "weaviate-client>=4.9"]
dev = ["pytest>=8.3"]

[project.scripts]
ragqa-eval = "ragqa.eval.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--tb=short"
