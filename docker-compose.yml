services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragqa
      POSTGRES_PASSWORD: ragqa
      POSTGRES_DB: ragqa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragqa -d ragqa"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAGQA_VECTOR_STORE: pgvector
      DATABASE_URL: postgresql://ragqa:ragqa@postgres:5432/ragqa
      RAGQA_EMBEDDER: sentence-transformers
      RAGQA_LLM: auto
      RAGQA_AUTO_INGEST: "1"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
